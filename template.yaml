AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Lambda for creating handle for a URI

Parameters:
  CognitoAuthorizerArn:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: Reference to Cognito UserPool for the stage
    Default: CognitoAuthorizerArn
  CognitoAuthorizerUrls:
    Type: AWS::SSM::Parameter::Value<CommaDelimitedList>
    Default: CognitoAuthorizerUrls
  CognitoAuthorizationUri:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: Cognito authorization URI used when resolving the customer of a client
    Default: "/NVA/CognitoUri"
  ExternalCognitoAuthorizerArn:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: Reference to ARN of ExternalUsers UserPool
    Default: ExternalCognitoAuthorizerArn
  ApiDomain:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: The Api domain
    Default: /NVA/ApiDomain
  ApplicationDomain:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: The Application domain
    Default: /NVA/ApplicationDomain
  CustomDomainBasePath:
    Type: String
    Description: Base path mapping in CustomDomain
    Default: handle
  ApprovalsDomainBasePath:
    Type: String
    Default: approval
  HandleBaseUri:
    Type: String
    Description: The host part of Handle URIs
    Default: https://hdl.handle.net
  HandlePrefix:
    Type: String
    Description: Reference to Handle Prefix to use
    Default: 11250.1
  HandlePrefixForApprovals:
    Type: String
    Description: Reference to Handle Prefix to use when creating approvals
    Default: 20.500.14886
  HandleDatabaseSecretName:
    Type: String
    Default: HandleDatabase
  EIPPrivateSubnet:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: Private Subnet ID for workloads where we need a static IP
    Default: /NVA/EIP/PrivateSubnet/id
  EIPSecurityGroupId:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: Security Group ID for workloads where we need a static IP
    Default: /NVA/EIP/SecurityGroup/GroupId
  AllowedOrigins:
    Type: String
    Description: comma separated list of external clients that are allowed to contact the HTTP APIs, "*" indicates that all origins are allowed
    Default: "*"
  ApprovalCredentialsName:
    Type: String
    Description: Name of the secret containing all approval credentials
    Default: ApprovalCredentials
  SearchInfrastructureCredentialsName:
    Type: String
    Description: Name of the secret containing credentials for the search infrastructure
    Default: SearchInfrastructureCredentials
  SearchInfrastructureApiHost:
    Type: String
    Description: Host of external search infrastructure API (SWS)
    Default: "https://api.sws.aws.sikt.no"
  SearchInfrastructureAuthUri:
    Type: String
    Description: URI to auth for external search infrastructure API (SWS)
    Default: "https://sws-auth.auth.eu-west-1.amazoncognito.com"
  ApprovalsSearchIndex:
    Type: String
    Description: Name of the search index holding approvals
    Default: approvals

Conditions:
  IsProd: !Equals [!Ref ApiDomain, "api.nva.unit.no"]

Globals:
  Function:
    Timeout: 900
    MemorySize: 1798
    Runtime: java25
    Architectures:
      - arm64
    Environment:
      Variables:
        ALLOWED_ORIGIN: !Ref AllowedOrigins
        API_HOST: !Ref ApiDomain
        COGNITO_AUTHORIZER_URLS: !Join [",", !Ref CognitoAuthorizerUrls]
        LOG_LEVEL: "info"
        LOG4J_CONFIGURATION_FILE: classpath:nva-log4j2.xml
  Api:
    OpenApiVersion: 3.0.1
    Cors:
      AllowMethods: "'OPTIONS,POST'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"

Resources:
  ApprovalsTable:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Delete
    Properties:
      TableName: !Sub nva-approvals-${AWS::StackName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK0
          AttributeType: S
        - AttributeName: SK0
          AttributeType: S
        - AttributeName: PK1
          AttributeType: S
        - AttributeName: SK1
          AttributeType: S
        - AttributeName: PK2
          AttributeType: S
        - AttributeName: SK2
          AttributeType: S
      KeySchema:
        - AttributeName: PK0
          KeyType: HASH
        - AttributeName: SK0
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: PK1
              KeyType: HASH
            - AttributeName: SK1
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: PK2
              KeyType: HASH
            - AttributeName: SK2
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      Tags:
        - Key: IncludedInBackup
          Value: "true"

  CreateSnapshotQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 1800
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CreateSnapshotDlq.Arn
        maxReceiveCount: 3

  CreateSnapshotDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  IndexApprovalQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 1800
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IndexApprovalDlq.Arn
        maxReceiveCount: 3

  IndexApprovalDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  ApprovalsStreamDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  ApprovalsEventBusQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref CreateSnapshotQueue
        - !Ref IndexApprovalQueue
        - !Ref ApprovalsStreamDlq
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              - !GetAtt CreateSnapshotQueue.Arn
              - !GetAtt IndexApprovalQueue.Arn
              - !GetAtt ApprovalsStreamDlq.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${ApprovalsEventBus.Name}/*"

  CreateSnapshotDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Source changed messages failed processing
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CreateSnapshotDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  IndexApprovalDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Index approval messages failed processing
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IndexApprovalDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ApprovalsStreamDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Stream records could not be delivered to the event bus or its targets
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ApprovalsStreamDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ApprovalsStreamPipeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: ApprovalsStreamPipePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: !GetAtt ApprovalsTable.StreamArn
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !GetAtt ApprovalsEventBus.Arn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt ApprovalsStreamDlq.Arn

  ApprovalsEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub nva-approvals-${AWS::StackName}

  ApprovalsStreamPipe:
    Type: AWS::Pipes::Pipe
    DependsOn:
      - ApprovalsEventBusQueuePolicy
      - CreateSnapshotFromSourceChangedEventRule
      - CreateSnapshotFromApprovalRevisionRule
      - IndexApprovalRule
    Properties:
      RoleArn: !GetAtt ApprovalsStreamPipeRole.Arn
      Source: !GetAtt ApprovalsTable.StreamArn
      SourceParameters:
        DynamoDBStreamParameters:
          StartingPosition: LATEST
          ParallelizationFactor: 1
          MaximumRecordAgeInSeconds: 86400
          MaximumRetryAttempts: 10
          OnPartialBatchItemFailure: AUTOMATIC_BISECT
          DeadLetterConfig:
            Arn: !GetAtt ApprovalsStreamDlq.Arn
        FilterCriteria:
          Filters:
            - Pattern: '{"eventName": ["INSERT"], "dynamodb": {"NewImage": {"type": {"S": ["SourceChangedEvent", "ApprovalRevision", "SourceSnapshot"]}}}}'
      Target: !GetAtt ApprovalsEventBus.Arn
      TargetParameters:
        EventBridgeEventBusParameters:
          DetailType: ApprovalsStreamRecord
          Source: nva.approvals

  CreateSnapshotFromSourceChangedEventRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Creates a snapshot when a source changed event is stored
      EventBusName: !Ref ApprovalsEventBus
      EventPattern:
        detail:
          dynamodb:
            NewImage:
              type:
                S:
                  - SourceChangedEvent
      Targets:
        - Id: CreateSnapshotQueue
          Arn: !GetAtt CreateSnapshotQueue.Arn
          DeadLetterConfig:
            Arn: !GetAtt ApprovalsStreamDlq.Arn
          InputTransformer:
            InputPathsMap:
              eventIdentifier: $.detail.dynamodb.NewImage.identifier.S
              cloudEventIdentifier: $.detail.dynamodb.NewImage.cloudEventIdentifier.S
              approvalIdentifier: $.detail.dynamodb.NewImage.approvalIdentifier.S
              customerIdentifier: $.detail.dynamodb.NewImage.customerIdentifier.S
              clientIdentifier: $.detail.dynamodb.NewImage.clientIdentifier.S
              handle: $.detail.dynamodb.NewImage.handle.S
              source: $.detail.dynamodb.NewImage.source.S
              timestamp: $.detail.dynamodb.NewImage.timestamp.S
            InputTemplate: '{"type": "SourceChangedEvent", "eventIdentifier": "<eventIdentifier>", "cloudEventIdentifier": "<cloudEventIdentifier>", "approvalIdentifier": "<approvalIdentifier>", "customerIdentifier": "<customerIdentifier>", "clientIdentifier": "<clientIdentifier>", "handle": "<handle>", "source": "<source>", "timestamp": "<timestamp>"}'

  CreateSnapshotFromApprovalRevisionRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Creates a snapshot when an approval revision is stored
      EventBusName: !Ref ApprovalsEventBus
      EventPattern:
        detail:
          dynamodb:
            NewImage:
              type:
                S:
                  - ApprovalRevision
      Targets:
        - Id: CreateSnapshotQueue
          Arn: !GetAtt CreateSnapshotQueue.Arn
          DeadLetterConfig:
            Arn: !GetAtt ApprovalsStreamDlq.Arn
          InputTransformer:
            InputPathsMap:
              revisionIdentifier: $.detail.dynamodb.NewImage.identifier.S
              approvalIdentifier: $.detail.dynamodb.NewImage.approvalIdentifier.S
              customerIdentifier: $.detail.dynamodb.NewImage.customerIdentifier.S
              clientIdentifier: $.detail.dynamodb.NewImage.clientIdentifier.S
              activity: $.detail.dynamodb.NewImage.activity.S
              approval: $.detail.dynamodb.NewImage.body.S
              timestamp: $.detail.dynamodb.NewImage.createdDate.S
            InputTemplate: '{"type": "ApprovalRevision", "revisionIdentifier": "<revisionIdentifier>", "approvalIdentifier": "<approvalIdentifier>", "customerIdentifier": "<customerIdentifier>", "clientIdentifier": "<clientIdentifier>", "activity": "<activity>", "approval": <approval>, "timestamp": "<timestamp>"}'

  IndexApprovalRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Indexes an approval when a source snapshot is stored
      EventBusName: !Ref ApprovalsEventBus
      EventPattern:
        detail:
          dynamodb:
            NewImage:
              type:
                S:
                  - SourceSnapshot
      Targets:
        - Id: IndexApprovalQueue
          Arn: !GetAtt IndexApprovalQueue.Arn
          DeadLetterConfig:
            Arn: !GetAtt ApprovalsStreamDlq.Arn
          InputTransformer:
            InputPathsMap:
              approvalIdentifier: $.detail.dynamodb.NewImage.approvalIdentifier.S
            InputTemplate: '{"approvalIdentifier": "<approvalIdentifier>"}'

  ReadHandleDatabaseSecretsManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:HandleDatabase-*"

  DynamoDbTableAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
            Resource:
              - !GetAtt ApprovalsTable.Arn
              - !Sub "${ApprovalsTable.Arn}/index/*"

  ReadApprovalCredentialsManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ApprovalCredentialsName}-*"

  ReadSearchInfrastructureCredentialsManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SearchInfrastructureCredentialsName}-*"

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 180

  NvaHandleServiceApi:
    Type: AWS::Serverless::Api
    Properties:
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: !Join
          - ""
          - - "{ "
            - '"apiId": "$context.apiId", '
            - '"requestId": "$context.requestId", '
            - '"requestTime": "$context.requestTime", '
            - '"requestTimeEpoch": "$context.requestTimeEpoch", '
            - '"httpMethod": "$context.httpMethod", '
            - '"path": "$context.path", '
            - '"queryString": "$context.requestQueryString", '
            - '"status": "$context.status", '
            - '"error.message": "$context.error.message", '
            - '"userAgent": "$context.identity.userAgent", '
            - '"ip": "$context.identity.sourceIp" '
            - "}"
      StageName: Prod
      EndpointConfiguration:
        Type: REGIONAL
      DefinitionBody:
        "Fn::Transform":
          Name: AWS::Include
          Parameters:
            Location: ./docs/handle-openapi.yaml

  NvaApprovalsApi:
    Type: AWS::Serverless::Api
    Properties:
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{ "apiId": "$context.apiId", "requestId": "$context.requestId", "requestTime": "$context.requestTime", "requestTimeEpoch": "$context.requestTimeEpoch", "httpMethod": "$context.httpMethod", "path": "$context.path", "status": "$context.status",  "error.message": "$context.error.message" }'
      StageName: Prod
      EndpointConfiguration:
        Type: REGIONAL
      DefinitionBody:
        "Fn::Transform":
          Name: AWS::Include
          Parameters:
            Location: ./docs/approvals-openapi.yaml

  NvaCreateHandleFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${NvaCreateHandleFunction}
      RetentionInDays: 180

  NvaCreateHandleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: handle
      Handler: no.sikt.nva.handle.CreateHandleHandler::handleRequest
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
        - !Ref ReadHandleDatabaseSecretsManagedPolicy
      Environment:
        Variables:
          HANDLE_PREFIX: !Ref HandlePrefix
          HANDLE_BASE_URI: !Ref HandleBaseUri
          HANDLE_DATABASE_SECRET_NAME: !Ref HandleDatabaseSecretName
      VpcConfig:
        SecurityGroupIds:
          - !Ref EIPSecurityGroupId
        SubnetIds:
          - !Ref EIPPrivateSubnet
      Events:
        CreateHandle:
          Type: Api
          Properties:
            Path: /
            Method: post
            RestApiId: !Ref NvaHandleServiceApi

  NvaUpdateHandleFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${NvaUpdateHandleFunction}
      RetentionInDays: 180

  NvaUpdateHandleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: handle
      Handler: no.sikt.nva.handle.UpdateHandleHandler::handleRequest
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
        - !Ref ReadHandleDatabaseSecretsManagedPolicy
      Environment:
        Variables:
          HANDLE_PREFIX: !Ref HandlePrefix
          HANDLE_BASE_URI: !Ref HandleBaseUri
          HANDLE_DATABASE_SECRET_NAME: !Ref HandleDatabaseSecretName
      VpcConfig:
        SecurityGroupIds:
          - !Ref EIPSecurityGroupId
        SubnetIds:
          - !Ref EIPPrivateSubnet
      Events:
        CreateHandle:
          Type: Api
          Properties:
            Path: /{prefix}/{suffix}
            Method: put
            RestApiId: !Ref NvaHandleServiceApi

  NvaCreateApprovalFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NvaCreateApprovalFunction}"
      RetentionInDays: 90

  NvaCreateApprovalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: approvals
      Handler: no.sikt.nva.approvals.rest.CreateApprovalHandler::handleRequest
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - !Ref ReadHandleDatabaseSecretsManagedPolicy
        - !Ref DynamoDbTableAccessPolicy
      Environment:
        Variables:
          HANDLE_PREFIX: !If [IsProd, !Ref HandlePrefixForApprovals, !Ref HandlePrefix]
          HANDLE_BASE_URI: !Ref HandleBaseUri
          HANDLE_DATABASE_SECRET_NAME: !Ref HandleDatabaseSecretName
          TABLE: !Ref ApprovalsTable
      VpcConfig:
        SecurityGroupIds:
          - !Ref EIPSecurityGroupId
        SubnetIds:
          - !Ref EIPPrivateSubnet
      Events:
        CreateApproval:
          Type: Api
          Properties:
            Path: /
            Method: post
            RestApiId: !Ref NvaApprovalsApi

  NvaFetchApprovalFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NvaFetchApprovalFunction}"
      RetentionInDays: 90

  NvaUpdateApprovalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: approvals
      Handler: no.sikt.nva.approvals.rest.UpdateApprovalHandler::handleRequest
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - !Ref ReadHandleDatabaseSecretsManagedPolicy
        - !Ref DynamoDbTableAccessPolicy
      Environment:
        Variables:
          HANDLE_PREFIX: !If [IsProd, !Ref HandlePrefixForApprovals, !Ref HandlePrefix]
          HANDLE_BASE_URI: !Ref HandleBaseUri
          HANDLE_DATABASE_SECRET_NAME: !Ref HandleDatabaseSecretName
          TABLE: !Ref ApprovalsTable
      VpcConfig:
        SecurityGroupIds:
          - !Ref EIPSecurityGroupId
        SubnetIds:
          - !Ref EIPPrivateSubnet
      Events:
        CreateApproval:
          Type: Api
          Properties:
            Path: /{approvalId}
            Method: put
            RestApiId: !Ref NvaApprovalsApi

  NvaUpdateApprovalFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NvaUpdateApprovalFunction}"
      RetentionInDays: 90

  NvaFetchApprovalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: approvals
      Handler: no.sikt.nva.approvals.rest.FetchApprovalHandler::handleRequest
      Policies:
        - !Ref DynamoDbTableAccessPolicy
        - !Ref ReadApprovalCredentialsManagedPolicy
      Environment:
        Variables:
          HANDLE_PREFIX: !If [IsProd, !Ref HandlePrefixForApprovals, !Ref HandlePrefix]
          TABLE: !Ref ApprovalsTable
          HANDLE_BASE_URI: !Ref HandleBaseUri
          HANDLE_DATABASE_SECRET_NAME: !Ref HandleDatabaseSecretName
          APPLICATION_DOMAIN: !Ref ApplicationDomain
          APPROVAL_CREDENTIALS: !Ref ApprovalCredentialsName
      Events:
        GetApproval:
          Type: Api
          Properties:
            Path: /{approvalId}
            Method: get
            RestApiId: !Ref NvaApprovalsApi

  NvaFetchContextFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NvaFetchContextFunction}"
      RetentionInDays: 90

  NvaFetchContextFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: approvals
      Handler: no.sikt.nva.approvals.rest.FetchContextHandler::handleRequest
      Events:
        GetContext:
          Type: Api
          Properties:
            Path: /context
            Method: get
            RestApiId: !Ref NvaApprovalsApi
        GetContextVersion:
          Type: Api
          Properties:
            Path: /context/{version}
            Method: get
            RestApiId: !Ref NvaApprovalsApi

  NvaFetchOntologyFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NvaFetchOntologyFunction}"
      RetentionInDays: 90

  NvaFetchOntologyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: approvals
      Handler: no.sikt.nva.approvals.rest.FetchOntologyHandler::handleRequest
      Events:
        GetOntology:
          Type: Api
          Properties:
            Path: /ontology
            Method: get
            RestApiId: !Ref NvaApprovalsApi
        GetOntologyVersion:
          Type: Api
          Properties:
            Path: /ontology/{version}
            Method: get
            RestApiId: !Ref NvaApprovalsApi

  NvaReceiveEventFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NvaReceiveEventFunction}"
      RetentionInDays: 90

  NvaReceiveEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: approvals
      Handler: no.sikt.nva.approvals.rest.ReceiveEventHandler::handleRequest
      Policies:
        - !Ref DynamoDbTableAccessPolicy
      Environment:
        Variables:
          TABLE: !Ref ApprovalsTable
      Events:
        ReceiveEvent:
          Type: Api
          Properties:
            Path: /events
            Method: post
            RestApiId: !Ref NvaApprovalsApi

  NvaFetchApprovalChangesFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NvaFetchApprovalChangesFunction}"
      RetentionInDays: 90

  NvaFetchApprovalChangesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: approvals
      Handler: no.sikt.nva.approvals.rest.FetchApprovalChangesHandler::handleRequest
      Policies:
        - !Ref DynamoDbTableAccessPolicy
      Environment:
        Variables:
          TABLE: !Ref ApprovalsTable
      Events:
        FetchApprovalChanges:
          Type: Api
          Properties:
            Path: /{approvalId}/change
            Method: get
            RestApiId: !Ref NvaApprovalsApi

  NvaFetchChangeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NvaFetchChangeFunction}"
      RetentionInDays: 90

  NvaFetchChangeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: approvals
      Handler: no.sikt.nva.approvals.rest.FetchChangeHandler::handleRequest
      Policies:
        - !Ref DynamoDbTableAccessPolicy
      Environment:
        Variables:
          TABLE: !Ref ApprovalsTable
      Events:
        FetchChange:
          Type: Api
          Properties:
            Path: /{approvalId}/change/{changeId}
            Method: get
            RestApiId: !Ref NvaApprovalsApi

  NvaCreateSnapshotFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NvaCreateSnapshotFunction}"
      RetentionInDays: 90

  NvaCreateSnapshotFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: approvals
      Handler: no.sikt.nva.approvals.snapshot.CreateSnapshotHandler::handleRequest
      Timeout: 300
      Policies:
        - !Ref DynamoDbTableAccessPolicy
        - !Ref ReadApprovalCredentialsManagedPolicy
      Environment:
        Variables:
          TABLE: !Ref ApprovalsTable
          APPROVAL_CREDENTIALS: !Ref ApprovalCredentialsName
      Events:
        SourceChanged:
          Type: SQS
          Properties:
            Queue: !GetAtt CreateSnapshotQueue.Arn
            BatchSize: 1

  NvaIndexApprovalFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NvaIndexApprovalFunction}"
      RetentionInDays: 90

  NvaIndexApprovalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: approvals
      Handler: no.sikt.nva.approvals.index.IndexApprovalHandler::handleRequest
      Timeout: 300
      Policies:
        - !Ref DynamoDbTableAccessPolicy
        - !Ref ReadSearchInfrastructureCredentialsManagedPolicy
      Environment:
        Variables:
          TABLE: !Ref ApprovalsTable
          SEARCH_INDEX: !Ref ApprovalsSearchIndex
          SEARCH_INFRASTRUCTURE_CREDENTIALS: !Ref SearchInfrastructureCredentialsName
          SEARCH_INFRASTRUCTURE_API_HOST: !Ref SearchInfrastructureApiHost
          SEARCH_INFRASTRUCTURE_AUTH_URI: !Ref SearchInfrastructureAuthUri
      Events:
        SnapshotCreated:
          Type: SQS
          Properties:
            Queue: !GetAtt IndexApprovalQueue.Arn
            BatchSize: 1

  NvaCreateHandleBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Properties:
      BasePath: !Sub ${CustomDomainBasePath}
      DomainName: !Ref ApiDomain
      RestApiId: !Ref NvaHandleServiceApi
      Stage: !Ref NvaHandleServiceApi.Stage

  NvaApprovalsApiBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Properties:
      BasePath: !Sub ${ApprovalsDomainBasePath}
      DomainName: !Ref ApiDomain
      RestApiId: !Ref NvaApprovalsApi
      Stage: !Ref NvaApprovalsApi.Stage
