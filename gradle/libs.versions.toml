[versions]
postgres = { strictly = '42.7.13' }
jte = { strictly = '3.2.4' }
glassfish-jakarta-json = { strictly = '2.0.1' }
jakarta-validation-api = { strictly = '3.1.1' }
apache-bval = { strictly = '3.1.0' }
titanium-rdf-api = { strictly = '1.0.0' }
opensearch-java = { strictly = '3.10.0' }
