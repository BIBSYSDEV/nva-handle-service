glassfish-jakarta-json = { group = 'org.glassfish', name = 'jakarta.json', version.ref = 'glassfish-jakarta-json' }
titanium-rdf-api = { group = 'com.apicatalog', name = 'titanium-rdf-api', version.ref = 'titanium-rdf-api' }
opensearch-java = { group = 'org.opensearch.client', name = 'opensearch-java', version.ref = 'opensearch-java' }
jakarta-json-api = { group = 'jakarta.json', name = 'jakarta.json-api', version.ref = 'jakarta-json-api' }

[plugins]
jte = { id = 'gg.jte.gradle', version.ref = 'jte' }
