version: 0.2

env:
  variables:
    GRADLE_USER_HOME: "/root/.gradle"
    GRADLE_OPTS: "-Dorg.gradle.configuration-cache=false"
    SAM_CLI_TELEMETRY: "0"

cache:
  paths:
    - "/root/.gradle/caches/**/*"

phases:
  install:
    runtime-versions:
      java: corretto25
    commands:
      - pip3 install aws-sam-cli
  build:
    commands:
      - sam build
      - sam package --s3-bucket $S3_BUCKET --output-template-file packaged.yaml
artifacts:
  files:
    - packaged.yaml
